<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全国ツアー｜営業-1グランプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
<style>

:root{
  --white:#fff;--bg:#faf9f6;--bg-warm:#f5f2ec;
  --text:#222;--text-sub:#555;--text-light:#888;
  --gold:#b8922e;--gold-light:#f0d77b;--gold-dark:#8a6d1a;
  --gold-grad:linear-gradient(135deg,#c9a227,#f0d060,#c9a227);
  --red:#d72631;--red-dark:#b51d26;--black:#1a1a1a;
  --border:#e8e4dc;--shadow:rgba(0,0,0,.08);
  --font:'Noto Sans JP',sans-serif;--font-a:'Zen Kaku Gothic New',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.8;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}

/* ── ヘッダー ── */
header{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(255,255,255,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.h-inner{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,40px);display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{display:flex;align-items:center}
.logo img{height:52px;width:auto;object-fit:contain}
nav{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
nav a{color:var(--text-sub);font-size:.74rem;font-weight:700;transition:color .3s;white-space:nowrap}
nav a:hover{color:var(--red)}
.ncta{background:var(--red);color:#fff!important;padding:8px 18px;font-weight:700!important;font-size:.72rem!important;border-radius:4px;transition:background .3s!important;white-space:nowrap}
.ncta:hover{background:var(--red-dark)!important}
.nav-diagnosis-button{background:var(--gold-grad);color:#3a2800!important;padding:8px 14px;font-weight:700!important;font-size:.72rem!important;border-radius:4px;white-space:nowrap;box-shadow:0 2px 6px rgba(184,146,46,.35);transition:filter .25s,box-shadow .25s!important}
.nav-diagnosis-button:hover{filter:brightness(1.1);box-shadow:0 4px 12px rgba(184,146,46,.45)!important;color:#3a2800!important}
.hbr{display:none;background:none;border:none;cursor:pointer;padding:6px}
.hbr span{display:block;width:22px;height:2px;background:var(--text);margin:5px 0}
.mnav{display:none;position:fixed;top:68px;left:0;right:0;z-index:999;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);padding:16px 24px;border-bottom:1px solid var(--border)}
.mnav.open{display:block}
.mnav a{display:block;padding:12px 0;color:var(--text-sub);font-size:.85rem;border-bottom:1px solid #eee}
.mnav .mnav-diagnosis{color:var(--gold-dark);font-weight:700}


/* 全国ツアー navigation */
.nav-tour-button{border:1px solid var(--gold);color:var(--gold-dark);padding:7px 12px;border-radius:4px;white-space:nowrap}
nav a{white-space:nowrap}
@media(max-width:1180px){nav a:not(.ncta):not(.nav-diagnosis-button){display:none}.hbr{display:block}}
.mnav{max-height:calc(100dvh - 68px);overflow-y:auto}

/* Gold premiere stage */
body{background:#090807}
main{position:relative;isolation:isolate;min-height:100svh;padding:136px 24px 68px;display:grid;place-items:center;text-align:center;overflow:hidden;background:radial-gradient(ellipse at 50% 44%,#39271755 0%,#12100d 44%,#080807 80%)}
.stage-halo{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,#ffd67519,transparent 48%);animation:halo-breathe 6s ease-in-out infinite}
.spotlight{position:absolute;top:-35%;width:75%;height:140%;pointer-events:none;background:conic-gradient(from 165deg at 50% 0%,transparent 0deg,#e6bd6014 7deg,#fff5c91c 15deg,transparent 26deg);filter:blur(14px);transform-origin:50% 0%;animation:spot-sweep 12s ease-in-out infinite alternate}
.spotlight.left{left:-15%;transform:rotate(-24deg)}
.spotlight.right{right:-15%;animation-delay:-6s;animation-direction:alternate-reverse}
.stage-frame{position:absolute;inset:100px clamp(18px,4vw,56px) 32px;pointer-events:none;border:1px solid #d5ac4e24;border-radius:2px}
.stage-frame::before,.stage-frame::after{content:'';position:absolute;width:40px;height:40px;border-color:#e8c87588;border-style:solid}
.stage-frame::before{top:-1px;left:-1px;border-width:1px 0 0 1px}
.stage-frame::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
.title-scene{position:relative;z-index:2;width:min(100%,1100px);padding:80px 0;animation:premiere-reveal 1.8s cubic-bezier(.16,1,.3,1) both}
.title-scene::before{content:'';position:absolute;left:12%;right:12%;top:50%;height:1px;background:linear-gradient(90deg,transparent,#ffe69b99,transparent);box-shadow:0 0 50px 14px #e8b84119;transform:translateY(48px)}
h1{position:relative;font-family:var(--font-a);font-size:clamp(3rem,8.2vw,7.5rem);font-weight:900;line-height:1.18;letter-spacing:-.025em;color:#e7c462;filter:drop-shadow(0 5px 0 #705018) drop-shadow(0 10px 12px #000b);animation:title-float 7s ease-in-out 1.8s infinite}
.gold-word{display:inline-block;position:relative;background:linear-gradient(115deg,#9a671d 0%,#eac975 12%,#fff5bf 21%,#c89235 30%,#ffe597 43%,#a77420 49%,#fff6cd 51%,#e8ba51 56%,#bc8229 68%,#fff0ad 82%,#a77520 100%);background-size:250% 100%;background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gold-flow 7s ease-in-out infinite}
.gold-word + .gold-word{margin-left:.15em;animation-delay:-.25s}
.title-orbit{position:absolute;left:50%;top:50%;width:min(88vw,830px);height:340px;transform:translate(-50%,-50%) rotate(-12deg);border:1px solid #dcb7611f;border-radius:50%;pointer-events:none}
.title-orbit::after{content:'';position:absolute;inset:-1px;border-radius:50%;border-top:1px solid #f8df9c80;transform:rotate(0);animation:orbit-turn 16s linear infinite}
.sparkle{position:absolute;z-index:3;width:4px;height:4px;border-radius:50%;background:#fff6cc;box-shadow:0 0 8px 2px #ffe49699,0 0 24px #e7b74277;animation:star-breathe 4s ease-in-out infinite;pointer-events:none}
.sparkle::before,.sparkle::after{content:'';position:absolute;left:50%;top:50%;background:linear-gradient(transparent,#fff5d3,transparent);transform:translate(-50%,-50%)}
.sparkle::before{width:1px;height:28px}.sparkle::after{width:28px;height:1px;background:linear-gradient(90deg,transparent,#fff5d3,transparent)}
.sparkle.one{left:24%;top:35%}.sparkle.two{right:18%;top:55%;animation-delay:-1.7s}.sparkle.three{left:57%;top:27%;animation-delay:-2.9s}
.particles{position:absolute;inset:68px 0 0;pointer-events:none;overflow:hidden}
.particle{position:absolute;bottom:-20px;left:var(--x);width:var(--size);height:var(--size);background:#edcc7b;border-radius:50%;box-shadow:0 0 9px #ffda8c88;opacity:0;animation:gold-rise var(--duration) linear var(--delay) infinite}
.stage-floor{position:absolute;bottom:-10%;left:-25%;width:150%;height:35%;background:radial-gradient(ellipse at 50% 50%,#c1933926,transparent 58%);transform:perspective(400px) rotateX(60deg);pointer-events:none}
@keyframes gold-flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes premiere-reveal{from{opacity:0;transform:translateY(34px) scale(.92);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes title-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes halo-breathe{0%,100%{opacity:.55;transform:scale(.98)}50%{opacity:1;transform:scale(1.08)}}
@keyframes spot-sweep{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes orbit-turn{to{transform:rotate(360deg)}}
@keyframes star-breathe{0%,100%{opacity:.12;transform:scale(.55)}50%{opacity:1;transform:scale(1.05)}}
@keyframes gold-rise{0%{opacity:0;transform:translate3d(0,0,0)}15%{opacity:var(--opacity)}85%{opacity:var(--opacity)}100%{opacity:0;transform:translate3d(var(--drift),-95svh,0)}}
@media(max-width:640px){main{padding:116px 28px 68px}.title-scene{padding:80px 0}.gold-word{display:block}.gold-word + .gold-word{margin:0}.title-orbit{height:300px;width:110%;transform:translate(-50%,-50%) rotate(-25deg)}h1{font-size:clamp(3rem,14vw,5.4rem);line-height:1.16}.title-scene::before{transform:translateY(84px)}.sparkle.one{left:9%;top:33%}.sparkle.two{right:7%;top:65%}.sparkle.three{left:75%;top:25%}}
@media(prefers-reduced-motion:reduce){.title-scene,h1,.gold-word,.stage-halo,.spotlight,.sparkle,.title-orbit::after,.particle{animation:none}.title-scene{opacity:1;transform:none;filter:none}.gold-word{background-position:45% 50%}.particle{opacity:.25;bottom:var(--rest-y)}}
</style>
<script defer src="assets/js/analytics.js"></script>
</head>
<body>
<header>
  <div class="h-inner">
    <a href="index.html" class="logo">
      <img src="assets/logos/eigyo1_logo.png" alt="営業-1グランプリ ロゴ" onerror="this.style.display='none'">
    </a>
    <nav>
      <a href="index.html#lv">最新情報</a>
      <a href="tour.html" class="nav-tour-button" aria-current="page">全国ツアー</a>
      <a href="buzz100.html">バズり動画100</a>

        <span></span><span></span><span></span>

    </nav>
  </div>
</header>

<div class="mnav" id="mn">
  <a href="index.html">TOP</a>
  <a href="index.html#lv">最新情報</a>
  <a href="tour.html" aria-current="page">全国ツアー</a>

  <a href="photo-gallery.html">写真館</a>
  <a href="archive-docs.html">資料館</a>
  <a href="goods.html">グッズ</a>
  <a href="timeline.html">シリーズ年表</a>
  <a href="diagnosis.html" class="mnav-diagnosis">営業タイプAI診断</a>
  <a href="https://www.yoshimoto.co.jp/kogyo-eigyo/" target="_blank" rel="noopener">イベント出演依頼</a>
</div>

<main>
  <div class="stage-halo" aria-hidden="true"></div>
  <div class="spotlight left" aria-hidden="true"></div>
  <div class="spotlight right" aria-hidden="true"></div>
  <div class="stage-frame" aria-hidden="true"></div>
  <div class="particles" aria-hidden="true"></div>
  <div class="stage-floor" aria-hidden="true"></div>
  <div class="title-scene">
    <div class="title-orbit" aria-hidden="true"></div>
    <h1 aria-label="Coming Soon！"><span class="gold-word" aria-hidden="true">Coming</span> <span class="gold-word" aria-hidden="true">Soon！</span></h1>
    <span class="sparkle one" aria-hidden="true"></span>
    <span class="sparkle two" aria-hidden="true"></span>
    <span class="sparkle three" aria-hidden="true"></span>
  </div>
</main>
<script>
const particles = document.querySelector('.particles');
const fragment = document.createDocumentFragment();
for (let i = 0; i < 44; i++) {
  const particle = document.createElement('span');
  particle.className = 'particle';
  particle.style.cssText = '--x:' + ((i * 37.7) % 100) + '%;--size:' + (1 + i % 3) + 'px;--duration:' + (12 + i % 13) + 's;--delay:-' + (i * .83) + 's;--opacity:' + (.18 + (i % 5) * .1) + ';--drift:' + ((i % 2 ? 1 : -1) * (12 + i % 50)) + 'px;--rest-y:' + ((i * 19) % 100) + '%';
  fragment.appendChild(particle);
}
particles.appendChild(fragment);
document.querySelectorAll('.mnav a').forEach(function(link){
  link.addEventListener('click',function(){document.getElementById('mn').classList.remove('open')});
});
</script>
</body>
</html>
